name: NARARYA GARAGE Repository Scraper

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: repository-scraper
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Scrape GitHub repositories
        env:
          GITHUB_TOKEN: ${{ secrets.NARARYA_GITHUB_TOKEN }}
          GITHUB_OWNER: nararyajayautamagroub
        run: npm run scrape:github
      - name: Commit snapshot when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/github-repositories.json; then
            echo "No repository changes."
            exit 0
          fi
          git add data/github-repositories.json
          git commit -m "chore: refresh GitHub repository snapshot"
          git push
