name: NARARYA GARAGE Screenshot Preview

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/screenshot-preview.yml"

permissions:
  contents: read

env:
  PRISMA_HIDE_UPDATE_MESSAGE: "1"
  NEXT_TELEMETRY_DISABLED: "1"
  AUTH_SECRET: "ci-screenshot-only-not-for-production"
  NEXT_PUBLIC_SITE_URL: "http://127.0.0.1:3000"

jobs:
  screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build production app
        run: npm run build
      - name: Install Playwright browser
        run: npx --yes playwright install --with-deps chromium
      - name: Start production server
        run: |
          npm run start > /tmp/nararya-next.log 2>&1 &
          echo $! > /tmp/nararya-next.pid
      - name: Wait for server
        run: |
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/nararya-next.log
          exit 1
      - name: Capture desktop and mobile screenshots
        run: |
          mkdir -p screenshots
          npx --yes playwright screenshot --browser chromium --viewport-size "1440,1000" --full-page http://127.0.0.1:3000/ screenshots/home-desktop.png
          npx --yes playwright screenshot --browser chromium --viewport-size "390,844" --full-page http://127.0.0.1:3000/ screenshots/home-mobile.png
          npx --yes playwright screenshot --browser chromium --viewport-size "1440,1000" --full-page http://127.0.0.1:3000/login screenshots/login-desktop.png
          npx --yes playwright screenshot --browser chromium --viewport-size "390,844" --full-page http://127.0.0.1:3000/login screenshots/login-mobile.png
      - name: Upload screenshots
        uses: actions/upload-artifact@v7
        with:
          name: nararya-garage-screenshots
          path: screenshots/*.png
          if-no-files-found: error
          retention-days: 14
